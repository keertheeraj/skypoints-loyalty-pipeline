name: 'skypoints_transformations'
version: '1.0.0'

profile: 'skypoints_transformations'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  manage_state: false

vars:
  run_date: '2024-01-16'
  stale_after_days: 90

models:
  skypoints_transformations:
    +materialized: table

seeds:
  skypoints_transformations:
    +schema: REFERENCE

data_tests:
  skypoints_transformations:
    +severity: error
    +store_failures: true
    +schema: TEST_FAILURES
    # Staging only reports bad rows; core filters them and its tests are strict
    01_staging:
      +severity: warn