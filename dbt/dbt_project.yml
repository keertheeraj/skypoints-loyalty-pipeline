name: 'skypoints_transformations'
version: '1.0.0'

profile: 'skypoints_transformations'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  manage_state: false

models:
  skypoints_transformations:
    +materialized: table

data_tests:
  skypoints_transformations:
    +severity: error
    +store_failures: true
    +schema: TEST_FAILURES
    # Staging only reports bad rows; core will filter them and fail on its own tests
    01_staging:
      +severity: warn